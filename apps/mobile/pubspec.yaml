name: moataz_ai_mobile
description: تطبيق Android أصلي لمنصة معتز AI، يتصل بالمنصة عبر API ولا يستخدم WebView.
publish_to: "none"
version: 1.3.0+5

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.0.0
  uuid: ^4.5.1
  file_picker: ^8.1.7
  font_awesome_flutter: ^11.0.0
  http_parser: ^4.1.2
  supabase_flutter: 2.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
