name: Puter Browser E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/puter/**"
      - "src/components/puter-provider-card.tsx"
      - "src/components/chat-console.tsx"
      - "src/app/api/dashboard/chat/puter/**"
      - "src/app/dashboard/chat/page.tsx"
      - "src/app/dashboard/providers/page.tsx"
      - "e2e/puter-provider.spec.ts"
      - "package*.json"
      - ".github/workflows/puter-e2e.yml"

permissions:
  contents: read

concurrency:
  group: puter-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moataz_puter_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moataz_puter_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moataz_puter_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moataz_puter_e2e
      E2E_BASE_URL: http://localhost:3000
      CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BOOTSTRAP_ADMIN_TOKEN: ci-only-bootstrap-token
      NEXT_PUBLIC_PUTER_ENABLED: "true"
      NEXT_PUBLIC_PUTER_E2E_MOCK: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate:all
      - run: npx playwright install --with-deps chromium
      - name: Start isolated app
        run: |
          npm run dev > puter-e2e-server.log 2>&1 &
          echo $! > puter-e2e-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat puter-e2e-server.log
          exit 1
      - run: mkdir -p artifacts/puter-ui
      - name: Run mocked Puter browser path
        run: npx playwright test e2e/puter-provider.spec.ts --reporter=list
      - name: Upload Puter UI screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: puter-ui-${{ github.run_id }}
          path: |
            artifacts/puter-ui
            puter-e2e-server.log
            test-results
          if-no-files-found: ignore
          retention-days: 7
