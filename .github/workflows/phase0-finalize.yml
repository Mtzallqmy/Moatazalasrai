# Temporary one-shot finalizer; removed after deterministic test and config fixes are pushed.
name: Phase 0 Finalize

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/phase0-platform-foundation-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/phase0-platform-foundation-v2
          fetch-depth: 0

      - name: Apply deterministic compatibility fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected block not found in ${path}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceExact(
            'tests/integration/worker-postgres.test.ts',
            '    const rejected = results.find((result) => result.status === "rejected");\n    expect(rejected).toMatchObject({ reason: expect.objectContaining({ code: "REFRESH_TOKEN_REUSED" }) });',
            '    const rejected = results.find((result) => result.status === "rejected");\n    if (!rejected || rejected.status !== "rejected") throw new Error("Expected one rejected refresh rotation.");\n    const rejectedCode = rejected.reason && typeof rejected.reason === "object" && "code" in rejected.reason\n      ? String((rejected.reason as { code?: unknown }).code)\n      : "";\n    // The loser may read before or after the winner commits; both outcomes fail closed and only one rotation succeeds.\n    expect(["REFRESH_TOKEN_REUSED", "REFRESH_TOKEN_INVALID"]).toContain(rejectedCode);',
          );

          replaceExact(
            'src/lib/platform/whatsapp-environment.ts',
            'function reportInspection(inspection: WhatsAppEnvironmentInspection): Omit<WhatsAppEnvironmentInspection, "config"> {\n  const { config: _config, ...safeInspection } = inspection;\n  return safeInspection;\n}',
            'function reportInspection(inspection: WhatsAppEnvironmentInspection): Omit<WhatsAppEnvironmentInspection, "config"> {\n  return {\n    authoritative: inspection.authoritative,\n    complete: inspection.complete,\n    valid: inspection.valid,\n    runtimeEnvironment: inspection.runtimeEnvironment,\n    railwayEnvironment: inspection.railwayEnvironment,\n    loadedCount: inspection.loadedCount,\n    requiredCount: inspection.requiredCount,\n    missing: inspection.missing,\n    invalid: inspection.invalid,\n    warnings: inspection.warnings,\n    variables: inspection.variables,\n  };\n}',
          );

          const oldConfig = 'vitest.config.ts';
          if (!fs.existsSync(oldConfig)) throw new Error('vitest.config.ts is missing');
          fs.writeFileSync('vitest.config.mts', `// Vitest 4 ESM configuration avoids the native-loader CommonJS compatibility warning.\nimport path from "node:path";\nimport { fileURLToPath } from "node:url";\nimport { defineConfig } from "vitest/config";\n\nconst rootDirectory = path.dirname(fileURLToPath(import.meta.url));\n\nexport default defineConfig({\n  test: {\n    environment: "node",\n    exclude: ["e2e/**", "node_modules/**", ".next/**"],\n  },\n  resolve: {\n    alias: {\n      "@": path.resolve(rootDirectory, "./src"),\n    },\n  },\n});\n`);
          fs.unlinkSync(oldConfig);
          NODE

      - name: Verify and push
        run: |
          git diff --check
          test -f vitest.config.mts
          test ! -e vitest.config.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/worker-postgres.test.ts src/lib/platform/whatsapp-environment.ts vitest.config.mts vitest.config.ts
          git commit -m "test: stabilize concurrent refresh and Vitest config"
          git push origin HEAD:feat/phase0-platform-foundation-v2
