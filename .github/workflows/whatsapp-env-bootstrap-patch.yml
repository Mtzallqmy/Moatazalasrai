# One-shot branch patcher; removed after applying deterministic source corrections.
name: WhatsApp Environment Bootstrap Patch

on:
  push:
    branches: [feat/whatsapp-env-bootstrap]
    paths:
      - .github/workflows/whatsapp-env-bootstrap-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/whatsapp-env-bootstrap
          fetch-depth: 0

      - name: Apply deterministic corrections
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected source not found in ${path}: ${before.slice(0, 100)}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          const runtime = 'src/lib/platform/whatsapp-environment.ts';
          replaceExact(runtime, 'const CACHE_TTL_MS = 60_000;', 'const CACHE_TTL_MS = 15 * 60_000;');
          replaceExact(
            runtime,
            'const SECRET_NAMES = new Set<EnvironmentName>([\n  "META_APP_SECRET",\n  "WHATSAPP_ACCESS_TOKEN",\n  "WHATSAPP_WEBHOOK_VERIFY_TOKEN",\n  "WHATSAPP_CONNECT_TOKEN_SECRET",\n]);',
            'const SECRET_NAMES = new Set<EnvironmentName>([\n  "META_APP_SECRET",\n  "WHATSAPP_ACCESS_TOKEN",\n  "WHATSAPP_WEBHOOK_VERIFY_TOKEN",\n  "WHATSAPP_CONNECT_TOKEN_SECRET",\n]);\n\nconst AUTHORITY_NAMES = WHATSAPP_ENVIRONMENT_NAMES.filter(\n  (name) => name !== "APP_URL" && name !== "PUBLIC_APP_URL",\n);',
          );
          replaceExact(
            runtime,
            '  const authoritative = loadedCount > 0;',
            '  const authoritative = AUTHORITY_NAMES.some((name) => Boolean(values[name]));',
          );
          replaceExact(
            runtime,
            '        appIdFound = subscriptionPayload.data.some((item) => Boolean(item && typeof item === "object" && "id" in item && String((item as { id?: unknown }).id) === config.appId));',
            '        appIdFound = subscriptionPayload.data.some((item) => {\n          if (!item || typeof item !== "object") return false;\n          const app = (item as { whatsapp_business_api_data?: { id?: unknown } }).whatsapp_business_api_data;\n          return String(app?.id ?? "") === config.appId;\n        });',
          );
          replaceExact(
            runtime,
            '    changed = JSON.stringify(existing) !== JSON.stringify(config);',
            '    changed = row?.whatsappManaged !== false\n      || row?.whatsappEnabled !== enabled\n      || JSON.stringify(existing) !== JSON.stringify(config);',
          );

          const hydration = 'src/lib/platform/runtime-hydration.ts';
          replaceExact(
            hydration,
            '  await initializeWhatsAppFromEnvironment();\n  return hydrateRuntimeControlPlane();',
            '  const report = await initializeWhatsAppFromEnvironment();\n  return hydrateRuntimeControlPlane(report.changed);',
          );

          const test = 'tests/whatsapp-environment-bootstrap.test.ts';
          replaceExact(
            test,
            '        data: [{ id: config.appId, name: "Moataz AI" }],',
            '        data: [{ whatsapp_business_api_data: { id: config.appId, name: "Moataz AI" } }],',
          );
          NODE

      - name: Verify patch
        run: |
          git diff --check
          git grep -n 'AUTHORITY_NAMES' src/lib/platform/whatsapp-environment.ts
          git grep -n 'whatsapp_business_api_data' src/lib/platform/whatsapp-environment.ts tests/whatsapp-environment-bootstrap.test.ts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/platform/whatsapp-environment.ts src/lib/platform/runtime-hydration.ts tests/whatsapp-environment-bootstrap.test.ts
          git commit -m "fix(whatsapp): preserve Railway environment authority"
          git push origin HEAD:feat/whatsapp-env-bootstrap
