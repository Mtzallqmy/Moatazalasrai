name: Agent Source Snapshot

on:
  push:
    branches:
      - agent/sandbox-major-release
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules -czf "$RUNNER_TEMP/moataz-source.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moataz-source-${{ github.sha }}
          path: ${{ runner.temp }}/moataz-source.tar.gz
          if-no-files-found: error
          retention-days: 1
