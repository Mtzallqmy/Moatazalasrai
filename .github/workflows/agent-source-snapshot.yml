name: Agent Source Snapshot

on:
  push:
    branches:
      - agent/sandbox-major-release
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules -czf "$RUNNER_TEMP/moataz-source.tar.gz" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moataz-source-${{ github.sha }}
          path: ${{ runner.temp }}/moataz-source.tar.gz
          if-no-files-found: error
          retention-days: 1
