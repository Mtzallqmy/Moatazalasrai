name: Refresh lockfile

on:
  push:
    branches: [feat/ai-sdk-graphile-worker-production]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-sdk-graphile-worker-production
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Generate synchronized package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify npm ci contract
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Synchronize package lock for Node 22 runtime"
          git push origin HEAD:feat/ai-sdk-graphile-worker-production
