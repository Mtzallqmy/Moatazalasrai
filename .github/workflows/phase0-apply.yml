# Temporary PR bootstrap: applies the reviewed Phase 0 driver migration, then is removed.
name: Phase 0 Apply

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/phase0-platform-foundation-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/phase0-platform-foundation-v2
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply pg driver implementation from reviewed Phase 0 commit
        run: |
          git checkout a723b75ac9b3ce4773a4cf239eb0837b3d18db7c -- \
            next.config.mjs \
            scripts/bootstrap-owner.mjs \
            scripts/healthcheck-worker.mjs \
            scripts/migrate-worker.mjs \
            scripts/migrate.mjs \
            scripts/start-production.mjs \
            scripts/wait-for-database-schema.mjs \
            src/ai/jobs/service.ts \
            src/ai/mcp/execution.ts \
            src/db/index.ts \
            src/db/pool.ts \
            src/db/result.ts \
            src/lib/ai-sdk/checkpoints.ts \
            src/lib/ai-sdk/run-events.ts \
            src/lib/ai-sdk/run-steps.ts \
            src/lib/integrations/whatsapp/linking.ts \
            src/worker/queue.ts \
            tests/deployment-config.test.ts \
            tests/helpers/pg-sql.ts \
            tests/integration/approvals-postgres.test.ts \
            tests/integration/cloudflare-provider-platform-postgres.test.ts \
            tests/integration/conversation-members-postgres.test.ts \
            tests/integration/puter-postgres.test.ts \
            tests/integration/whatsapp-postgres.test.ts \
            tests/integration/worker-postgres.test.ts

      - name: Preserve WhatsApp startup while sharing the pg pool with Graphile Worker
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/worker/index.ts';
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace('import { db } from "@/db";\n', 'import { db } from "@/db";\nimport { closePostgresPool, getPostgresPool } from "@/db/pool";\n');
          source = source.replace('import { env } from "@/lib/config/env";\n', '');
          source = source.replace(
            '  await telemetryShutdown?.().catch(() => undefined);\n  console.info',
            '  await telemetryShutdown?.().catch(() => undefined);\n  await closePostgresPool().catch(() => undefined);\n  console.info',
          );
          source = source.replace(
            '  runner = await run({\n    connectionString: env().databaseUrl,',
            '  runner = await run({\n    pgPool: getPostgresPool(),',
          );
          source = source.replace(
            '  await runner.promise;\n}',
            '  await runner.promise;\n  if (!stopping) await shutdown("runner-complete");\n}',
          );
          for (const expected of ['initializeWhatsAppFromEnvironment', 'pgPool: getPostgresPool()', 'closePostgresPool']) {
            if (!source.includes(expected)) throw new Error(`Worker migration missed ${expected}`);
          }
          fs.writeFileSync(file, source);
          NODE

      - name: Move remaining test fixtures from postgres-js to pg
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function filesBelow(directory) {
            if (!fs.existsSync(directory)) return [];
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const target = path.join(directory, entry.name);
              return entry.isDirectory() ? filesBelow(target) : [target];
            });
          }
          const helper = path.resolve('tests/helpers/pg-sql.ts');
          const files = [...filesBelow('tests'), ...filesBelow('e2e')].filter((file) => /\.(?:ts|tsx|js|mjs|cjs)$/.test(file));
          for (const file of files) {
            let source = fs.readFileSync(file, 'utf8');
            if (!/from ["']postgres["']/.test(source)) continue;
            const match = source.match(/import\s+postgres(?:\s*,\s*\{([^}]*)\})?\s+from\s+["']postgres["'];/);
            if (!match) throw new Error(`Unsupported postgres import in ${file}`);
            let relative = path.relative(path.dirname(path.resolve(file)), helper).replaceAll(path.sep, '/').replace(/\.ts$/, '');
            if (!relative.startsWith('.')) relative = `./${relative}`;
            const needsSql = /\bSql\b|ReturnType<typeof postgres>/.test(source);
            source = source.replace(match[0], needsSql
              ? `import { createTestSqlClient, type Sql } from "${relative}";`
              : `import { createTestSqlClient } from "${relative}";`);
            source = source.replaceAll('ReturnType<typeof postgres>', 'Sql');
            source = source.replace(/postgres\(([^,\n]+),\s*\{[^}]*?max:\s*(\d+)[^}]*?\}\)/g, 'createTestSqlClient($1, $2)');
            source = source.replace(/postgres\(([^)\n]+)\)/g, 'createTestSqlClient($1)');
            if (/from ["']postgres["']|\bpostgres\s*\(/.test(source)) throw new Error(`postgres-js reference remains in ${file}`);
            fs.writeFileSync(file, source);
          }
          NODE

      - name: Remove postgres-js and refresh the lockfile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete manifest.dependencies.postgres;
          fs.writeFileSync('package.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node scripts/verify-lockfile.mjs

      - name: Verify migration invariants
        run: |
          if git grep -nE 'from ["'"']postgres["'"']|require\(["'"']postgres["'"']\)' -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs'; then
            echo "postgres-js imports remain" >&2
            exit 1
          fi
          node -e "const p=require('./package.json'); if(p.dependencies.postgres) process.exit(1); if(!p.dependencies.pg) process.exit(1); if(p.devDependencies.vitest !== '^4.1.10') process.exit(1)"
          git diff --check

      - name: Commit implementation
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Phase 0 source already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/phase0-apply.yml'
          git commit -m "refactor(db): consolidate PostgreSQL on pg"
          git push origin HEAD:feat/phase0-platform-foundation-v2
