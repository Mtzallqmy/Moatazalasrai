name: Apply reviewed replacement v2

on:
  push:
    branches:
      - agent/full-production-replacement
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-reviewed-replacement
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[replacement-v2-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout replacement branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-production-replacement
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .replacement/patch-00
          cat .replacement/patch-* | base64 --decode > /tmp/replacement.tar.xz
          echo "0d3cd8aa635f43245d3b82b8e9a00fb06495ee13fb18993b6ac7c27946d97e93  /tmp/replacement.tar.xz" | sha256sum --check --strict
          mkdir -p /tmp/replacement
          tar -xJf /tmp/replacement.tar.xz -C /tmp/replacement
          test -f /tmp/replacement/.replacement-deletions

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              /*|*".."*) echo "Unsafe deletion path: $path" >&2; exit 1 ;;
            esac
            rm -rf -- "$path"
          done < /tmp/replacement/.replacement-deletions

          rm -f /tmp/replacement/.replacement-deletions
          cp -a /tmp/replacement/. .
          rm -rf .replacement
          rm -f .github/workflows/apply-reviewed-replacement.yml
          rm -f .github/workflows/apply-reviewed-replacement-v2.yml

          test -f package.json
          test -f package-lock.json
          test -f Dockerfile
          test -f drizzle/0000_platform_schema.sql
          test -f scripts/start-production.mjs
          test -f src/app/api/auth/login/route.ts
          test -f src/app/api/auth/register/route.ts
          test -f src/app/dashboard/chat/page.tsx

      - name: Commit and push reviewed replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No replacement changes to commit."
            exit 0
          fi
          git commit -m "Replace repository with reviewed production platform [replacement-v2-applied]"
          git push origin HEAD:agent/full-production-replacement
