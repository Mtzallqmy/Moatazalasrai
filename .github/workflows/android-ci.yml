name: Android Flutter CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release.yml"
      - "apps/mobile/**"
      - "src/app/api/mobile/**"
      - "src/app/api/v1/**"
      - "src/ai/mcp/**"
      - "src/lib/http/contracts.ts"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, test, and build arm64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Verify arm64 release build
        env:
          ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: >-
          flutter build apk
          --release
          --target-platform android-arm64
          --split-per-abi
          --dart-define=API_BASE_URL=https://moatazalalqami.online
      - name: Verify APK exists
        run: test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
