name: Sync run status schema

on:
  push:
    branches: [feat/ai-sdk-graphile-worker-production]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, 'Synchronize Drizzle run status') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-sdk-graphile-worker-production
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Synchronize enum with migration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/db/schema.ts';
          const before = fs.readFileSync(path, 'utf8');
          const from = 'export const runStatus = pgEnum("run_status", ["queued", "running", "completed", "failed", "cancelled"]);';
          const to = 'export const runStatus = pgEnum("run_status", ["queued", "running", "waiting_approval", "completed", "failed", "cancelled"]);';
          if (!before.includes(from) && !before.includes(to)) throw new Error('run_status declaration was not found');
          fs.writeFileSync(path, before.replace(from, to));
          NODE
      - name: Commit synchronized schema
        run: |
          if git diff --quiet -- src/db/schema.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db/schema.ts
          git commit -m "Synchronize Drizzle run status with approval migration"
          git push origin HEAD:feat/ai-sdk-graphile-worker-production
