# Temporary one-shot synchronizer for PR 53; removed after the branch is updated.
# Trigger revision: 2.
name: Phase 0 Main Synchronizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase0-sync-runner.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/phase0-platform-foundation
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Merge current main while preserving Phase 0 decisions
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit -X ours origin/main
          git rm -f .github/workflows/phase0-sync-runner.yml

      - name: Reconcile package manifest and lockfile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete manifest.dependencies.postgres;
          manifest.devDependencies.vitest = '^4.1.10';
          fs.writeFileSync('package.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node scripts/verify-lockfile.mjs

      - name: Verify source invariants
        run: |
          if git grep -nE 'from ["'"']postgres["'"']|require\(["'"']postgres["'"']\)' -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs'; then
            echo "postgres-js imports remain" >&2
            exit 1
          fi
          node -e "const p=require('./package.json'); if(p.dependencies.postgres) process.exit(1); if(!p.dependencies.pg) process.exit(1); if(p.devDependencies.vitest !== '^4.1.10') process.exit(1)"
          git diff --check

      - name: Commit synchronized branch
        run: |
          git add -A
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:feat/phase0-platform-foundation
