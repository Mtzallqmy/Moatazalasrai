name: Bootstrap Puter Provider Branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && hashFiles('puter-patch/part-*') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/puter-provider
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
      - name: Apply reviewed Puter integration patch
        run: |
          cat puter-patch/part-* | base64 --decode | gzip --decompress > "$RUNNER_TEMP/puter.patch"
          git apply --index "$RUNNER_TEMP/puter.patch"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git add package-lock.json
          git rm -r puter-patch .github/workflows/puter-bootstrap.yml
      - name: Commit branch implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(ai): add optional browser-side Puter provider"
          git push origin HEAD:feature/puter-provider
