name: Refresh channel lockfile once

on:
  push:
    branches:
      - feat/channel-site-mcp-runtime
    paths:
      - .github/workflows/refresh-channel-lockfile-once.yml
      - package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/channel-site-mcp-runtime
          fetch-depth: 0

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Regenerate lockfile deterministically
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed lockfile and remove one-shot workflow
        run: |
          rm .github/workflows/refresh-channel-lockfile-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-channel-lockfile-once.yml
          git diff --cached --check
          git commit -m "fix(deps): refresh lockfile for patched nanoid"
          git push origin HEAD:feat/channel-site-mcp-runtime
