name: Android arm64 Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the android-v prefix
        required: true
        default: "1.3.0"
        type: string
      api_base_url:
        description: Production API base URL
        required: true
        default: "https://moatazbot.duckdns.org"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-release.yml"
      - "apps/mobile/**"
      - "src/app/api/mobile/**"
      - "src/app/api/v1/**"
      - "src/ai/mcp/**"
      - "src/db/mcp-catalog-schema.ts"
      - "drizzle/0012_mcp_full_catalog.sql"
      - "src/lib/http/contracts.ts"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      DEFAULT_API_BASE_URL: https://moatazbot.duckdns.org
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#android-v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="$(awk -F'[ +]' '/^version:/{print $2; exit}' pubspec.yaml)"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid production semantic version: ${version}" >&2
            exit 1
          fi
          api_base_url="${{ inputs.api_base_url }}"
          if [[ -z "${api_base_url}" ]]; then api_base_url="${DEFAULT_API_BASE_URL}"; fi
          if [[ ! "${api_base_url}" =~ ^https://[^/]+(/.*)?$ ]]; then
            echo "Production API must use HTTPS: ${api_base_url}" >&2
            exit 1
          fi
          api_base_url="${api_base_url%/}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=android-v${version}" >> "${GITHUB_OUTPUT}"
          echo "api_base_url=${api_base_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify production API
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 30 \
            "${{ steps.release.outputs.api_base_url }}/api/health" >/dev/null

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/app/release-keystore.jks
          {
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "storeFile=release-keystore.jks"
          } > android/key.properties

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build arm64 release APK
        run: >-
          flutter build apk
          --release
          --target-platform android-arm64
          --split-per-abi
          --build-name=${{ steps.release.outputs.version }}
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=${{ steps.release.outputs.api_base_url }}

      - name: Prepare checksum and artifact
        shell: bash
        run: |
          source="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          target="build/app/outputs/flutter-apk/Moataz-AI-${{ steps.release.outputs.version }}-arm64.apk"
          test -f "${source}"
          mv "${source}" "${target}"
          sha256sum "${target}" > "${target}.sha256"
          echo "apk=${target}" >> "${GITHUB_ENV}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moataz-AI-${{ steps.release.outputs.version }}-arm64
          path: |
            apps/mobile/${{ env.apk }}
            apps/mobile/${{ env.apk }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: معتز AI Android ${{ steps.release.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            إصدار إنتاجي أصلي لنظام Android متصل بمنصة معتز عبر REST API وMCP.

            - المعمارية: arm64-v8a فقط
            - الخادم: ${{ steps.release.outputs.api_base_url }}
            - Flutter: 3.44.7 stable
            - التوقيع: Release keystore عند توفر GitHub Secrets، وإلا توقيع تثبيت احتياطي
            - MCP: أدوات وموارد وقوالب موارد ومطالبات ونتائج متعددة الوسائط
            - التحقق: flutter analyze + flutter test + فحص API قبل البناء
          files: |
            apps/mobile/${{ env.apk }}
            apps/mobile/${{ env.apk }}.sha256
