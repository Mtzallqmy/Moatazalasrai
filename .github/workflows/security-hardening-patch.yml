name: Security Hardening Patch

on:
  pull_request:
    branches: [feat/phase0-platform-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/security-hardening-mfa-attachments'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/security-hardening-mfa-attachments
          fetch-depth: 0

      - name: Patch Telegram and attachment queue safety
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceRequired(source, before, after, label) {
            if (!source.includes(before)) throw new Error(`Missing patch anchor: ${label}`);
            return source.replace(before, after);
          }

          const telegramPath = 'src/app/api/webhooks/telegram/[integrationId]/route.ts';
          let telegram = fs.readFileSync(telegramPath, 'utf8');
          telegram = replaceRequired(
            telegram,
            'import { apiSuccess, getRequestId } from "@/lib/http/api";',
            'import { apiSuccess, getRequestId, handleApiError } from "@/lib/http/api";',
            'telegram http import',
          );
          telegram = replaceRequired(
            telegram,
            'import { storeAttachment } from "@/lib/storage/attachments";\nimport { attachmentContext } from "@/lib/storage/attachments";',
            'import { attachmentContext, storeAttachment, waitForAttachmentReady } from "@/lib/storage/attachments";\nimport { recordDeniedAccess } from "@/lib/security/audit";\nimport { enforceRateLimit, requestClientKey } from "@/lib/security/rate-limit";',
            'telegram storage imports',
          );
          telegram = replaceRequired(
            telegram,
            '            attachmentIds.push(stored.id);',
            '            await waitForAttachmentReady(input.integration.organizationId, stored.id);\n            attachmentIds.push(stored.id);',
            'telegram attachment wait',
          );
          telegram = replaceRequired(
            telegram,
            '  if (!expectedHash || !suppliedSecret || !secureHashEquals(expectedHash, suppliedSecret)) {\n    return new Response(null, { status: 401 });\n  }\n  const update = await request.json().catch(() => null) as TelegramUpdate | null;',
            '  if (!expectedHash || !suppliedSecret || !secureHashEquals(expectedHash, suppliedSecret)) {\n    await recordDeniedAccess({\n      organizationId: integration.organizationId,\n      reason: "TELEGRAM_SECRET_INVALID",\n      requestId,\n      route: `/api/webhooks/telegram/${integrationId}`,\n    });\n    return new Response(null, { status: 401, headers: { "cache-control": "no-store", "x-request-id": requestId } });\n  }\n  try {\n    await enforceRateLimit({\n      scope: "telegram.webhook.ip",\n      key: requestClientKey(request, integrationId),\n      limit: 3_000,\n      windowMs: 60_000,\n    });\n  } catch (error) {\n    return handleApiError(error, requestId, "/api/webhooks/telegram/:integrationId");\n  }\n  const update = await request.json().catch(() => null) as TelegramUpdate | null;',
            'telegram secret and rate guard',
          );
          fs.writeFileSync(telegramPath, telegram);

          const attachmentPath = 'src/lib/storage/attachments.ts';
          let attachments = fs.readFileSync(attachmentPath, 'utf8');
          attachments = replaceRequired(
            attachments,
            '  if (storage && objectKey) await storage.put({ key: objectKey, body: input.content, contentType: declaredMime, sha256 });\n  try {',
            '  if (storage && objectKey) await storage.put({ key: objectKey, body: input.content, contentType: declaredMime, sha256 });\n  let persisted = false;\n  try {',
            'attachment persistence flag',
          );
          attachments = replaceRequired(
            attachments,
            '    if (!created) throw new Error("ATTACHMENT_CREATE_FAILED");\n    try {',
            '    if (!created) throw new Error("ATTACHMENT_CREATE_FAILED");\n    persisted = true;\n    try {',
            'attachment persisted marker',
          );
          attachments = replaceRequired(
            attachments,
            '    if (storage && objectKey) await storage.delete(objectKey).catch(() => undefined);',
            '    if (!persisted && storage && objectKey) await storage.delete(objectKey).catch(() => undefined);',
            'attachment cleanup guard',
          );
          fs.writeFileSync(attachmentPath, attachments);
          NODE

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-hardening-patch.yml
          git add src/app/api/webhooks/telegram/'[integrationId]'/route.ts src/lib/storage/attachments.ts
          git commit -m "feat(security): bind Telegram and attachment scan guards"
          git push origin HEAD:feat/security-hardening-mfa-attachments
