# Temporary discovery job; removed after committing the database-derived RLS inventory.
name: RLS Discovery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  discover:
    if: github.head_ref == 'feat/postgres-rls-isolation'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moataz_rls_discovery
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d moataz_rls_discovery"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moataz_rls_discovery
      CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CREDENTIAL_ENCRYPTION_KEY_ID: rls-ci
      BOOTSTRAP_ADMIN_TOKEN: rls-ci-bootstrap-token
      AI_WORKER_ENABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/postgres-rls-isolation
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate:all
      - name: Query live schema and commit raw discovery
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 1 });
          const exact = await pool.query(`SELECT table_name, column_name FROM information_schema.columns WHERE column_name = 'org_id' AND table_schema = 'public' ORDER BY table_name`);
          const canonical = await pool.query(`SELECT table_name, column_name FROM information_schema.columns WHERE column_name = 'organization_id' AND table_schema = 'public' ORDER BY table_name`);
          const tables = await pool.query(`SELECT c.relname AS table_name, c.relrowsecurity AS rls_enabled, c.relforcerowsecurity AS rls_forced FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r' ORDER BY c.relname`);
          const indexes = await pool.query(`SELECT tablename AS table_name, indexname, indexdef FROM pg_indexes WHERE schemaname='public' ORDER BY tablename,indexname`);
          const schemas = await pool.query(`SELECT table_schema, table_name FROM information_schema.tables WHERE table_type='BASE TABLE' AND table_schema NOT IN ('pg_catalog','information_schema') ORDER BY table_schema,table_name`);
          const lines = [
            '# RLS database discovery (generated from clean PostgreSQL 16)',
            '',
            '<!-- Generated by CI after applying all migrations. Do not edit manually. -->',
            '',
            '## Required exact `org_id` query',
            '',
            '```text',
            ...(exact.rows.length ? exact.rows.map(r => `${r.table_name} | ${r.column_name}`) : ['(0 rows)']),
            '```',
            '',
            '## Canonical `organization_id` columns',
            '',
            '```text',
            ...canonical.rows.map(r => `${r.table_name} | ${r.column_name}`),
            '```',
            '',
            '## Public base tables',
            '',
            '| table | RLS enabled | RLS forced |',
            '|---|---:|---:|',
            ...tables.rows.map(r => `| ${r.table_name} | ${r.rls_enabled} | ${r.rls_forced} |`),
            '',
            '## Non-system schemas',
            '',
            '```text',
            ...schemas.rows.map(r => `${r.table_schema}.${r.table_name}`),
            '```',
            '',
            '## Indexes',
            '',
            '```text',
            ...indexes.rows.map(r => `${r.table_name} | ${r.indexname} | ${r.indexdef}`),
            '```',
            '',
          ];
          fs.writeFileSync('docs/RLS_DISCOVERY.md', `${lines.join('\n')}\n`);
          await pool.end();
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RLS_DISCOVERY.md
          git commit -m "docs(rls): record live PostgreSQL inventory"
          git push origin HEAD:feat/postgres-rls-isolation
