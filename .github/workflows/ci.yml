name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-cloudflare-typefix:
    if: github.head_ref == 'feature/cloudflare-provider-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply reviewed TypeScript fixes
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bootstrap/cloudflare-typefix.patch.b64 ]]; then
            echo "Patch already applied."
            exit 0
          fi
          echo "fe539849e0f547986ae0abc06340ddf70a64d95d30abf5707ef2edb3413130e2  .bootstrap/cloudflare-typefix.patch.b64" | sha256sum --check --strict
          base64 --decode .bootstrap/cloudflare-typefix.patch.b64 | gzip --decompress > /tmp/cloudflare-typefix.patch
          echo "60810887c4835cae0a89af9e04c1e2d434ee8f5f82b995e8f3835a6f97784c78  /tmp/cloudflare-typefix.patch" | sha256sum --check --strict
          git apply --check --whitespace=nowarn /tmp/cloudflare-typefix.patch
          git apply --whitespace=nowarn /tmp/cloudflare-typefix.patch
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): narrow provider runtime types and preserve validation compatibility"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
