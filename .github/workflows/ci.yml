name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-cloudflare-patch:
    if: github.head_ref == 'feature/cloudflare-provider-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
      - name: Diagnose transport chunk 04
        shell: bash
        run: |
          set -euo pipefail
          file=.bootstrap/cloudflare-provider-patch.04.b64
          wc -c "$file"
          git hash-object "$file"
          rm -f /tmp/cf04.*
          split -b 1000 -d -a 2 "$file" /tmp/cf04.
          for part in /tmp/cf04.*; do
            printf '%s ' "$(basename "$part")"
            sha256sum "$part" | cut -d' ' -f1
          done
