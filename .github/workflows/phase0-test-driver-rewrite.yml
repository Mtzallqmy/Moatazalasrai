# Temporary one-shot workflow: rewrites test fixtures from postgres-js to the shared pg test adapter.
name: Phase 0 Test Driver Rewrite

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.head_ref == 'feat/phase0-platform-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/phase0-platform-foundation
          fetch-depth: 0

      - name: Rewrite postgres-js test imports and constructors
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function filesBelow(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const target = path.join(directory, entry.name);
              return entry.isDirectory() ? filesBelow(target) : [target];
            });
          }

          const helper = path.resolve('tests/helpers/pg-sql.ts');
          const files = filesBelow('tests').filter((file) => /\.(?:ts|tsx|js|mjs|cjs)$/.test(file));
          const changed = [];

          for (const file of files) {
            let source = fs.readFileSync(file, 'utf8');
            if (!/from ["']postgres["']/.test(source)) continue;

            const importMatch = source.match(/import\s+postgres(?:\s*,\s*\{([^}]*)\})?\s+from\s+["']postgres["'];/);
            if (!importMatch) throw new Error(`Unsupported postgres import in ${file}`);
            const named = importMatch[1]?.replace(/\s+/g, ' ').trim();
            if (named && named !== 'type Sql') {
              throw new Error(`Unsupported named postgres import in ${file}: ${named}`);
            }

            let relative = path.relative(path.dirname(path.resolve(file)), helper).replaceAll(path.sep, '/').replace(/\.ts$/, '');
            if (!relative.startsWith('.')) relative = `./${relative}`;
            const needsSqlType = /\bSql\b|ReturnType<typeof postgres>/.test(source);
            const replacementImport = needsSqlType
              ? `import { createTestSqlClient, type Sql } from "${relative}";`
              : `import { createTestSqlClient } from "${relative}";`;
            source = source.replace(importMatch[0], replacementImport);
            source = source.replaceAll('ReturnType<typeof postgres>', 'Sql');
            source = source.replace(
              /postgres\(([^,\n]+),\s*\{[^}]*?max:\s*(\d+)[^}]*?\}\)/g,
              'createTestSqlClient($1, $2)',
            );
            source = source.replace(/postgres\(([^)\n]+)\)/g, 'createTestSqlClient($1)');

            if (/from ["']postgres["']|\bpostgres\s*\(/.test(source)) {
              throw new Error(`postgres-js reference remains in ${file}`);
            }
            fs.writeFileSync(file, source);
            changed.push(file);
          }

          if (changed.length === 0) throw new Error('No postgres-js test imports were found.');
          console.log(JSON.stringify({ event: 'test_driver.rewritten', files: changed }));
          NODE

      - name: Commit rewritten fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test(db): move PostgreSQL fixtures to pg"
          git push origin HEAD:feat/phase0-platform-foundation
