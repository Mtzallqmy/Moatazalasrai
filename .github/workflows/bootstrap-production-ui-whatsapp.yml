name: Bootstrap production UI and WhatsApp completion

on:
  push:
    branches:
      - agent/production-ui-whatsapp-completion
    paths:
      - ".github/bootstrap/production-ui-whatsapp/**"
      - ".github/workflows/bootstrap-production-ui-whatsapp.yml"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    # Runs only for a user-authored PR event; the generated commit removes this workflow.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: agent/production-ui-whatsapp-completion

      - name: Apply verified delivery
        shell: bash
        run: |
          set -euo pipefail

          expected_repair_hashes=(
            76ca386e6cfaeba95057fa1875a7cb1c16522721
            ba1bcc4e80298856b930a9f4c1326cc9409a24bf
            6d9ba3adb7c66f1f6fa868c955f6cfd4bbacb34d
            c21f2d192f18a2a66c01f414e08a57dd540ae929
            c9fc5ff6ce8b7f71d66fc1dc2d5eb9cbc1dc93d2
            b7fd54122ba8248c475e536ec9d1c78f0f347ea0
            1e7521df09917a2a509591b44e7bb9fc2125c5f1
            438af328daeaf1474c1cf3d6c759aa4d26c5163d
          )

          for index in {0..7}; do
            file=".github/bootstrap/production-ui-whatsapp/repair-09-0${index}.b64"
            test "$(wc -c < "$file")" -eq 1000
            test "$(git hash-object "$file")" = "${expected_repair_hashes[$index]}"
          done

          {
            cat .github/bootstrap/production-ui-whatsapp/part-{00..08}.b64
            cat .github/bootstrap/production-ui-whatsapp/repair-09-*.b64
            cat .github/bootstrap/production-ui-whatsapp/part-{10..12}.b64
          } > /tmp/production-ui-whatsapp.patch.gz.b64

          test "$(wc -c < /tmp/production-ui-whatsapp.patch.gz.b64)" -eq 135360
          base64 --decode /tmp/production-ui-whatsapp.patch.gz.b64 > /tmp/production-ui-whatsapp.patch.gz
          echo "a9784da98cbdc2c454978de9cb18b48f3a1b5f03c76f37980cf52cbb2d843c23  /tmp/production-ui-whatsapp.patch.gz" | sha256sum -c -
          gzip -dc /tmp/production-ui-whatsapp.patch.gz > /tmp/production-ui-whatsapp.patch
          echo "12801943d2b0594aaddc817c56e38daa96f245afb7583dda9f5868c524a83899  /tmp/production-ui-whatsapp.patch" | sha256sum -c -
          git apply --check /tmp/production-ui-whatsapp.patch
          git apply /tmp/production-ui-whatsapp.patch
          rm -rf .github/bootstrap/production-ui-whatsapp
          rm -f .github/workflows/bootstrap-production-ui-whatsapp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete production UI and WhatsApp integration"
          git push origin "HEAD:agent/production-ui-whatsapp-completion"
