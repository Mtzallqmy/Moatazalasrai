name: Sandbox Major Release CI

on:
  push:
    branches:
      - agent/sandbox-major-release
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "services/**"
      - "drizzle/**"
      - "tests/**"
      - "package*.json"
      - "drizzle.config.ts"
      - ".env.example"
      - "railway*.json"

permissions:
  contents: read

concurrency:
  group: sandbox-major-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://user:password@example.invalid/database?sslmode=require
      CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CREDENTIAL_ENCRYPTION_KEY_ID: ci
      CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS: "{}"
      BOOTSTRAP_ADMIN_TOKEN: ci-only-bootstrap-token
      APP_URL: http://localhost:3000
      BROWSER_AGENT_ENABLED: "false"
      GOOGLE_OAUTH_INTEGRATIONS_ENABLED: "false"
      SANDBOX_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
