name: Channel Platform Remediation

on:
  push:
    branches: [feat/channel-platform-whatsapp]
    paths:
      - .github/workflows/channel-platform-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channel-platform-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message || '', '[channel-remediation]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout channel branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/channel-platform-whatsapp
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply deterministic source fixes
        run: python3 scripts/remediate-channel-platform.py

      - name: Install and validate
        run: |
          git diff --check
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test

      - name: Commit remediated source
        run: |
          if git diff --quiet; then
            echo "No remediation changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/channel-manager.tsx src/db/channel-schema.ts src/lib/channels/router.ts src/lib/channels/telegram-adapter.ts src/lib/ai-sdk/runtime.ts src/lib/agents/runtime.ts
          git commit -m "fix(channels): apply validated channel remediation [channel-remediation]"
          git push origin HEAD:feat/channel-platform-whatsapp
