name: Fix approval expiry transaction

on:
  push:
    branches: [feat/ai-sdk-graphile-worker-production]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Persist expired approval before returning conflict') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ai-sdk-graphile-worker-production
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
      - name: Patch transaction result
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/lib/ai-sdk/approvals.ts';
          let source = fs.readFileSync(path, 'utf8');
          const oldExpired = `    if (current.expiresAt <= now) {
      await tx.update(toolApprovalsRuntime).set({ status: "expired", updatedAt: now }).where(eq(toolApprovalsRuntime.id, current.id));
      await tx.insert(auditLogs).values({
        organizationId: input.organizationId,
        actorType: "user",
        actorId: input.userId,
        action: "tool_approval.expired",
        resourceType: "tool_approval",
        resourceId: current.id,
        metadata: { runId: current.runId, toolId: current.toolId },
      });
      throw new ApiError(409, "TOOL_APPROVAL_EXPIRED", "انتهت صلاحية طلب الموافقة.");
    }`;
          const newExpired = `    if (current.expiresAt <= now) {
      await tx.update(toolApprovalsRuntime).set({ status: "expired", updatedAt: now }).where(eq(toolApprovalsRuntime.id, current.id));
      await tx.insert(auditLogs).values({
        organizationId: input.organizationId,
        actorType: "user",
        actorId: input.userId,
        action: "tool_approval.expired",
        resourceType: "tool_approval",
        resourceId: current.id,
        metadata: { runId: current.runId, toolId: current.toolId },
      });
      return { kind: "expired" as const, approval: current };
    }`;
          const oldReturn = `    return updated;
  });
  if (result.runId) {
    await appendRunEvent({
      organizationId: input.organizationId,
      runId: result.runId,
      type: "approval.resolved",
      payload: { approvalId: result.approvalId, approved: input.approved, toolCallId: result.toolCallId },
    });
  }
  return result;`;
          const newReturn = `    return { kind: "decided" as const, approval: updated };
  });
  if (result.kind === "expired") {
    throw new ApiError(409, "TOOL_APPROVAL_EXPIRED", "انتهت صلاحية طلب الموافقة.");
  }
  const approval = result.approval;
  if (approval.runId) {
    await appendRunEvent({
      organizationId: input.organizationId,
      runId: approval.runId,
      type: "approval.resolved",
      payload: { approvalId: approval.approvalId, approved: input.approved, toolCallId: approval.toolCallId },
    });
  }
  return approval;`;
          if (!source.includes(oldExpired) && !source.includes(newExpired)) throw new Error('Expiry block not found');
          source = source.replace(oldExpired, newExpired);
          if (!source.includes(oldReturn) && !source.includes(newReturn)) throw new Error('Decision return block not found');
          source = source.replace(oldReturn, newReturn);
          fs.writeFileSync(path, source);
          NODE
      - name: Commit fix
        run: |
          if git diff --quiet -- src/lib/ai-sdk/approvals.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai-sdk/approvals.ts
          git commit -m "Persist expired approval before returning conflict"
          git push origin HEAD:feat/ai-sdk-graphile-worker-production
