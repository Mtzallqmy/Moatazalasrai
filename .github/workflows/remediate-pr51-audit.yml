name: Remediate PR 51 production audit

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.number == 51 && github.head_ref == 'agent/production-ui-whatsapp-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/production-ui-whatsapp-completion
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
          cache: npm
      - name: Update production dependency lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node scripts/verify-lockfile.mjs
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          git diff --check
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lock is already remediated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): remediate production audit findings"
          git push origin HEAD:agent/production-ui-whatsapp-completion
