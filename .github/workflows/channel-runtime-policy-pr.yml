name: Apply Channel Platform Remediation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/channel-runtime-policy-pr.yml
  pull_request_target:
    types: [ready_for_review]

permissions:
  contents: write

concurrency:
  group: apply-channel-platform-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/channel-platform-whatsapp')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout channel branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/channel-platform-whatsapp
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply deterministic remediation
        run: python3 scripts/remediate-channel-platform.py

      - name: Validate patched source
        run: |
          git diff --check
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck

      - name: Commit source fixes
        run: |
          if git diff --quiet; then
            echo "No source changes remain to apply."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/channel-manager.tsx src/db/channel-schema.ts src/lib/channels/router.ts src/lib/channels/telegram-adapter.ts src/lib/ai-sdk/runtime.ts src/lib/agents/runtime.ts
          git commit -m "fix(channels): apply production channel remediation"
          git push origin HEAD:feat/channel-platform-whatsapp
